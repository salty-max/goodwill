# Every day, and by hand: Goodwill's game data built again from wow-data's
# pins (salty-max/wow-data's addon-data.yml: wow-data beside it, the
# databases downloaded; addon-kit beside it, for the check): each game's
# factions (their quests, turn-ins, kills, unlocks) and the names they need
# in every language, the chapters, then the language files. When one
# changes, a pull request with the checks run, then merged by itself and
# told to the owner's phone.
name: Game data

on:
  schedule:
    - cron: "58 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  data:
    uses: salty-max/wow-data/.github/workflows/addon-data.yml@main
    secrets: inherit
    with:
      kit: true
      generate: |
        bun scripts/factions.ts
        bun scripts/chapters.ts
        bun scripts/locales.ts
      paths: |
        i18n
        addon/Goodwill
